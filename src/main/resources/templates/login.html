<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-md bg-white shadow-lg rounded-lg p-6">
    <h1 class="text-2xl font-bold mb-4 text-center text-gray-800">Welcome Back</h1>

    <div th:if="${param.error}" class="mb-4 text-red-600 text-center font-semibold">
      Invalid username or password.
    </div>

    <div th:if="${param.logout}" class="mb-4 text-green-600 text-center font-semibold">
      You’ve been logged out.
    </div>

    <form th:action="@{/login}" method="post" class="space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Username</label>
        <input type="text" name="username" placeholder="jonny.silverhand"
               class="w-full border border-gray-300 rounded p-2" required />
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" name="password" placeholder="neverfadeaway"
               class="w-full border border-gray-300 rounded p-2" required />
      </div>

      <div>
        <input type="submit" value="Sign In"
               class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 cursor-pointer transition" />
      </div>
    </form>

    <p class="mt-4 text-center text-sm text-gray-600">
      Don’t have an account? <a th:href="@{/register}" class="text-blue-600 hover:underline">Sign up here</a>
    </p>
  </div>

</body>
</html>
